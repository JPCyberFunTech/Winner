<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>Congratulations</title>
	<style>
		:root {
			background: #dff6dc;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
		}

		body {
			background: #dff6dc;
		}

		.winner-image {
			display: block;
			width: 100vw;
			height: 100vh;
			height: 100dvh;
			object-fit: cover;
			object-position: center;
		}
	</style>
</head>
<body>
	<picture>
		<source media="(max-width: 767px)" srcset="img/MWinner.jpg">
		<img class="winner-image" src="img/Winner.png" alt="Congratulations illustration">
	</picture>
</body>
</html>
